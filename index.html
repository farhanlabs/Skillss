<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Veritus Staffforce Private Limited | Recruitment &amp; Staffing Solutions</title>
<meta name="description" content="Veritus Staffforce Private Limited provides permanent recruitment, temporary staffing, bulk hiring and payroll support. Connecting Talent, Driving Success.">
<meta property="og:title" content="Veritus Staffforce Private Limited">
<meta property="og:description" content="Connecting Talent, Driving Success.">
<meta name="theme-color" content="#0b2239">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230b2239'/><text x='50' y='68' font-size='58' text-anchor='middle' fill='%23c9a24b' font-family='serif' font-weight='bold'>V</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
 --navy:#0b2239;--navy2:#12304f;--gold:#c9a24b;--gold2:#b58f3a;
 --teal:#0f766e;--bg:#f6f8fb;--line:#e3e8ef;--text:#475569;--wa:#25d366;
 --shadow:0 10px 30px rgba(11,34,57,.08);--radius:14px
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:80px}
body{font-family:'Inter',sans-serif;color:var(--text);line-height:1.7;background:#fff;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{text-decoration:none;color:inherit}
ul{list-style:none}
.container{width:min(1180px,92%);margin:auto}
h1,h2,h3,h4{font-family:'Playfair Display',serif;color:var(--navy);line-height:1.2}
section{padding:96px 0}
.eyebrow{display:inline-flex;align-items:center;gap:10px;color:var(--gold2);font-weight:600;letter-spacing:2.5px;font-size:.75rem;text-transform:uppercase;margin-bottom:14px}
.eyebrow::before{content:"";width:28px;height:2px;background:var(--gold)}
.title{font-size:clamp(1.8rem,3.6vw,2.7rem);margin-bottom:16px}
.lead{max-width:620px;font-size:1.02rem}
.head{margin-bottom:54px}
.head.center{text-align:center}.head.center .lead{margin:auto}.head.center .eyebrow::before{display:none}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:14px 30px;border-radius:8px;font-weight:600;font-size:.92rem;border:2px solid transparent;cursor:pointer;transition:.3s;font-family:inherit}
.btn-gold{background:var(--gold);color:#fff}
.btn-gold:hover{background:var(--gold2);transform:translateY(-2px);box-shadow:0 10px 22px rgba(201,162,75,.35)}
.btn-wa{background:var(--wa);color:#fff}
